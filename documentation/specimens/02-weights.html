<!doctype html>
<meta charset="utf-8">
<title>Solvik weights</title>
<link rel="stylesheet" href="specimen.css">
<style>
  .rows { flex: 1; display: flex; flex-direction: column; justify-content: space-between; margin-top: 30px; }
  .row { display: grid; grid-template-columns: 70px 1fr auto; align-items: baseline; border-top: 1.5px solid rgba(255,255,255,.35); padding-top: 4px; }
  .num { font-size: 17px; font-weight: 600; letter-spacing: .06em; color: #c3ccff; }
  .name { font-size: 92px; line-height: 1.12; letter-spacing: -.025em; }
  .it { font-size: 92px; line-height: 1.12; letter-spacing: -.025em; font-style: italic; color: #c3ccff; }
</style>
<body class="bluepage">
<div class="page">
  <div class="top"><span>Solvik · Weights</span><span>Seven weights, each with an italic</span></div>
  <div class="rows">
    <div class="row" style="font-weight:200"><span class="num">200</span><span class="name">ExtraLight</span><span class="it">a quiet fjord</span></div>
    <div class="row" style="font-weight:300"><span class="num">300</span><span class="name">Light</span><span class="it">morning ferry</span></div>
    <div class="row" style="font-weight:400"><span class="num">400</span><span class="name">Regular</span><span class="it">open water</span></div>
    <div class="row" style="font-weight:600"><span class="num">600</span><span class="name">SemiBold</span><span class="it">good harbour</span></div>
    <div class="row" style="font-weight:700"><span class="num">700</span><span class="name">Bold</span><span class="it">round stones</span></div>
    <div class="row" style="font-weight:800"><span class="num">800</span><span class="name">ExtraBold</span><span class="it">loud gulls</span></div>
    <div class="row" style="font-weight:900"><span class="num">900</span><span class="name">Black</span><span class="it">deep cove</span></div>
  </div>
</div>
</body>
